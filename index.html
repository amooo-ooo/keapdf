    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('kea_theme') || 'system';
        } catch (e) {
          // note: ignore storage access errors
        }
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener('change', function (e) {
          var current = 'system';
          try {
            current = localStorage.getItem('kea_theme') || 'system';
          } catch (err) {
            // note: ignore storage access errors
          }
          if (current === 'system') {
            document.documentElement.classList.add('theme-transition-suppressed');
            document.documentElement.classList.toggle('dark', e.matches);
            void document.documentElement.offsetHeight;
            if (typeof window.requestAnimationFrame === 'function') {
              window.requestAnimationFrame(function () {
                document.documentElement.classList.remove('theme-transition-suppressed');
              });
            } else {
              document.documentElement.classList.remove('theme-transition-suppressed');
            }
          }
        });
      })();
    </script>
